<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos recebidos | Vozes da Escola</title>
    <link rel="icon" href="../assets/icons/voz-escola.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <nav class="navegacao" aria-label="Navegação principal">
            <a class="marca" href="../index.html"><img src="../assets/icons/voz-escola.svg" alt="" width="40" height="40">Vozes da Escola</a>
            <button class="menu-toggle" type="button" aria-controls="links-navegacao" aria-expanded="false"><span aria-hidden="true">☰</span> Menu</button>
            <div id="links-navegacao" class="links-navegacao">
                <a href="../index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="escolas.html">Escolas</a>
                <a href="materiais.html">Materiais</a>
                <a href="pedidos.html">Pedir apoio</a>
                <a href="faq.html">FAQ</a>
                <a href="integrantes.html">Integrantes</a>
                <a href="contato.html">Contato</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="apresentacao-pagina">
            <h1>Pedidos recebidos</h1>
            <p>Veja as necessidades registradas e acompanhe o andamento de cada pedido.</p>
        </section>

        <section class="secao-pedidos-equipe" aria-labelledby="titulo-lista-pedidos">
            <h2 id="titulo-lista-pedidos">Lista de pedidos</h2>
            <p id="aviso-lista-pedidos" role="status"></p>
            <ul id="lista-pedidos" class="lista-pedidos"></ul>
        </section>

        <section class="secao-pedidos-equipe" aria-labelledby="titulo-resposta-equipe">
            <h2 id="titulo-resposta-equipe">Responder a um pedido</h2>
            <form id="formulario-equipe" class="formulario-pedido">
                <label for="protocolo-equipe">Pedido</label>
                <select id="protocolo-equipe" name="protocolo" required>
                    <option value="">Selecione um protocolo</option>
                </select>

                <label for="status-equipe">Novo status</label>
                <select id="status-equipe" name="status" required>
                    <option value="">Selecione</option>
                    <option value="Em análise">Em análise</option>
                    <option value="Respondido">Respondido</option>
                    <option value="Concluído">Concluído</option>
                </select>

                <label for="mensagem-equipe">Resposta</label>
                <textarea id="mensagem-equipe" name="resposta" rows="4" maxlength="500"></textarea>
                <button class="botao" type="submit">Salvar atualização</button>
                <p id="aviso-resposta-equipe" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <footer class="rodape">
        <div class="conteudo-rodape">
            <p><strong>Vozes da Escola</strong><br>Apoio à educação escolar indígena.</p>
            <a href="contato.html">Contato</a>
        </div>
    </footer>
</body>
</html>
